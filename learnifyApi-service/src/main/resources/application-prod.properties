

# prod rabbitmq config
spring.rabbitmq.host=ragmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

#spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:drop-vector.sql

#multipart file  limit
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


rag-worker.base-url={RAG_WORKER_URL}

#spring ai config

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.enabled=true
spring.ai.openai.embedding.enabled=false

#free tier model can use other later
spring.ai.openai.chat.options.model=${GROQ_CHAT_MODEL}
spring.ai.openai.chat.options.temperature=0.7


#prod db
spring.datasource.url=jdbc:postgresql://localhost:5432/learnifytest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
