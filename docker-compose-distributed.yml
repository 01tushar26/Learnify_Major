version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ragmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  rag-worker:
    image: rag-worker:latest
    container_name: learnify-rag-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq

  video-worker:
    image: video-worker:latest
    container_name: learnify-video-worker

    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - rabbitmq

  learnifyapi-service:
    image: learnifyapi-service:latest
    container_name: learnify-api-service

    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq

  transcript-server:
    image: transcription-service:latest
    container_name: learnify-transcript-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq