version: "3.9"

services:

  frontend:
    image: learnify-client:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_URL=http://localhost:5173
        - VITE_BACKEND_URL=http://localhost:8080/api/v1
    container_name: learnify-client
    restart: unless-stopped
    ports:
      - "5173:80"
  

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ragmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  rag-worker:
    image: rag-worker:latest
    container_name: learnify-rag-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq

  video-worker:
    image: video-worker:latest
    container_name: learnify-video-worker

    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - rabbitmq

  learnifyapi-service:
    image: learnifyapi-service:latest
    container_name: learnify-api-service

    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq

  transcript-server:
    image: transcription-service:latest
    container_name: learnify-transcript-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

  ollama:
    image: alpine/ollama:latest
    container_name: learnify-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        # never unload the model after idle (avoids slow cold loads)
      OLLAMA_CONTEXT_LENGTH: "2048"  # nomic-embed-text's trained context; silences the num_ctx warning
    expose:
      - "11434"   # reachable only from other containers on the compose network
    volumes:
      - ollama_data:/root/.ollama   # models persist across restarts
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Optional: uncomment for NVIDIA GPU (nomic-embed-text runs fine on CPU too)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # One-shot job: pulls the model into the ollama volume, then exits
  ollama-pull:
    image: alpine/ollama:latest
    container_name: learnify-ollama-pull
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Pull the model, then send one embed request so it is already loaded in memory
    # when rag-worker starts (a cold load on a small CPU can exceed the client's 10s timeout)
    entrypoint:
      - sh
      - -c
      - >
        ollama pull nomic-embed-text &&
        wget -q -O /dev/null
        --header='Content-Type: application/json'
        --post-data='{"model":"nomic-embed-text","input":"warmup","keep_alive":-1}'
        http://ollama:11434/api/embed
volumes:
  ollama_data: