

# prod rabbitmq config
spring.rabbitmq.host=ragmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:drop-vector.sql

#multipart file  limit
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


spring.profiles.active=${SPRING_PROFILES_ACTIVE}

#prod db
spring.datasource.url=jdbc:postgresql://postgres:5432/ragdb
spring.datasource.username=raguser
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
